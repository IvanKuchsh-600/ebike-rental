{{define "content"}}
<h2 style="margin-bottom: 2rem;">Выплаты партнёру</h2>

<!-- Preview за месяц -->
<article style="margin-bottom: 2rem;">
    <header>
        <h3>Расчёт за месяц</h3>
        <small>Посчитать, сколько должен партнёру</small>
    </header>

    <div class="form-actions" style="align-items: end; flex-wrap: wrap;">
        <label style="flex: 1; min-width: 200px;">
            Месяц
            <input type="month" id="preview-month" value="">
        </label>

        <button class="btn-action" onclick="loadPreview()" style="margin-bottom: 1rem;">Посчитать</button>
    </div>

    <div id="preview-loading" style="display: none; text-align: center;">Загрузка...</div>
    <div id="preview-error" style="color: red; display: none;"></div>

    <div id="preview-result" style="display: none; margin-top: 1rem;">
        <div class="grid">
            <div style="text-align: center; padding: 1rem; background: var(--pico-card-background-color);">
                <h4 style="margin-bottom: 0.5rem;">Общая выручка</h4>
                <p style="font-size: 1.8rem; font-weight: bold; margin: 0;" id="preview-revenue">—</p>
            </div>
            <div style="text-align: center; padding: 1rem; background: var(--pico-card-background-color);">
                <h4 style="margin-bottom: 0.5rem;">Доля партнёра</h4>
                <p style="font-size: 1.8rem; font-weight: bold; margin: 0; color: green;" id="preview-share">—</p>
            </div>
        </div>

        <button class="btn-action" onclick="fixPayout()" style="margin-top: 1rem;">Зафиксировать выплату</button>
        <div id="preview-fix-error" style="color: red; margin-top: 0.5rem; display: none;"></div>
    </div>
</article>

<!-- Список выплат -->
<section>
    <h3>История выплат</h3>

    <div id="payouts-loading">Загрузка...</div>
    <div id="payouts-error" style="color: red; display: none;"></div>
    <div class="table-wrapper">

        <table id="payouts-table" style="display: none;">
            <thead>
            <tr>
                <th>ID</th>
                <th>Период</th>
                <th>Выручка</th>
                <th>Доля партнёра</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody id="payouts-tbody"></tbody>
        </table>
    </div>

    <div id="payouts-empty" style="display: none; text-align: center; color: var(--pico-muted-color);">
        Пока нет ни одной выплаты
    </div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', loadPayoutsPage);
</script>
{{end}}
