{{define "content"}}
<div class="page-header">
    <h2>Велосипеды</h2>
    <span style="color: var(--pico-muted-color);">
        <small>Только просмотр</small>
    </span>
</div>

<div id="bikes-loading">Загрузка...</div>
<div id="bikes-error" style="color: red; display: none;"></div>
<div class="table-wrapper">
    <table id="bikes-table" style="display: none;">
        <thead>
        <tr>
            <th>Фото</th>
            <th>Серийный номер</th>
            <th>Модель</th>
            <th>Статус</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody id="bikes-tbody"></tbody>
    </table>
</div>

<div id="bikes-empty" style="display: none; text-align: center; color: var(--pico-muted-color);">
    Нет велосипедов
</div>

<!-- Модалка / секция с поломками велосипеда -->
<article id="bike-details" class="bike-details-card" style="display: none;">
    <header class="bike-details-header">
        <h3 id="bike-details-title">Велосипед</h3>
        <button class="secondary outline btn-sm" onclick="closeBikeDetails()">Закрыть</button>
    </header>

    <div class="bike-details-body">
        <!-- Фото -->
        <div class="bike-details-photo" id="bike-details-photo-container">
            <!-- Заполняется через JS -->
        </div>

        <!-- Информация -->
        <div class="bike-details-info">
            <div class="bike-info-list">
                <div class="bike-info-item">
                    <div class="bike-info-label">Серийный номер</div>
                    <div class="bike-info-value" id="bike-details-serial">—</div>
                </div>

                <div class="bike-info-item">
                    <div class="bike-info-label">Модель</div>
                    <div class="bike-info-value" id="bike-details-model">—</div>
                </div>

                <div class="bike-info-item">
                    <div class="bike-info-label">Статус</div>
                    <div class="bike-info-value" id="bike-details-status">—</div>
                </div>

                <div class="bike-info-item">
                    <div class="bike-info-label">Дата добавления</div>
                    <div class="bike-info-value" id="bike-details-created">—</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Секция поломок -->
    <div class="bike-details-breakdowns">
        <h4>История поломок</h4>

        <div id="breakdowns-loading">Загрузка...</div>
        <div id="breakdowns-error" style="color: red; display: none;"></div>

        <div class="table-wrapper">
            <table id="breakdowns-table" style="display: none;">
                <thead>
                <tr>
                    <th>Причина</th>
                    <th>Стоимость</th>
                    <th>Дата</th>
                    <th>Статус</th>
                </tr>
                </thead>
                <tbody id="breakdowns-tbody"></tbody>
            </table>
        </div>

        <div id="breakdowns-empty" style="display: none; text-align: center; color: var(--pico-muted-color);">
            У этого велосипеда нет поломок
        </div>
    </div>
</article>

<script>
    document.addEventListener('DOMContentLoaded', loadPartnerBikesPage);
</script>
{{end}}
