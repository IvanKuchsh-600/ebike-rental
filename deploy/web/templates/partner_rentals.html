{{define "content"}}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <h2>Аренды</h2>
    <span style="color: var(--pico-muted-color);">
        <small>Только просмотр</small>
    </span>
</div>

<div id="rentals-loading">Загрузка...</div>
<div id="rentals-error" style="color: red; display: none;"></div>

<table id="rentals-table" style="display: none;">
    <thead>
    <tr>
        <th>Велосипед</th>
        <th>Арендатор</th>
        <th>Начало</th>
        <th>Возврат</th>
        <th>Сумма</th>
        <th>Оплата</th>
        <th>Статус</th>
    </tr>
    </thead>
    <tbody id="rentals-tbody"></tbody>
</table>

<div id="rentals-empty" style="display: none; text-align: center; color: var(--pico-muted-color);">
    Нет аренд
</div>

<script>
    document.addEventListener('DOMContentLoaded', loadPartnerRentalsPage);
</script>
{{end}}
