{{define "content"}}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <h2>Велосипеды</h2>
    <button onclick="openCreateBikeForm()">Добавить велосипед</button>
</div>

<!-- Форма создания (скрыта по умолчанию) -->
<!-- Форма (создание / редактирование) -->
<!-- Форма (создание / редактирование) -->
<!-- Форма (создание / редактирование) -->
<article id="bike-form-container" style="display: none; margin-bottom: 2rem;">
    <header>
        <h3 id="bike-form-title">Новый велосипед</h3>
    </header>

    <form id="bike-form" onsubmit="handleBikeFormSubmit(event)">
        <!-- Скрытое поле: id для редактирования -->
        <input type="hidden" id="bike-form-id" value="">

        <label>
            Серийный номер *
            <input type="text" name="serial_number" id="bike-form-serial" required placeholder="BIKE-001">
        </label>

        <label>
            Модель
            <input type="text" name="model" id="bike-form-model" placeholder="Xiaomi Pro 2">
        </label>

        <label>
            Комментарий
            <textarea name="comment" id="bike-form-comment" rows="2" placeholder="Заметки"></textarea>
        </label>

        <div style="display: flex; gap: 1rem;">
            <button type="submit" id="bike-form-submit">Сохранить</button>
            <button type="button" class="secondary" onclick="closeBikeForm()">Отмена</button>
        </div>

        <div id="bike-form-error" style="color: red; margin-top: 1rem; display: none;"></div>
    </form>
</article>

<!-- Таблица велосипедов -->
<div id="bikes-loading">Загрузка...</div>
<div id="bikes-error" style="color: red; display: none;"></div>

<table id="bikes-table" style="display: none;">
    <thead>
    <tr>
        <th>ID</th>
        <th>Серийный номер</th>
        <th>Модель</th>
        <th>Статус</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody id="bikes-tbody"></tbody>
</table>

<div id="bikes-empty" style="display: none; text-align: center; color: var(--pico-muted-color);">
    Нет велосипедов. Добавьте первый!
</div>

<script>
    document.addEventListener('DOMContentLoaded', loadBikesPage);
</script>

<!-- Модалка / секция с поломками велосипеда -->
<article id="bike-details" style="display: none; margin-top: 2rem;">
    <header style="display: flex; justify-content: space-between; align-items: center;">
        <h3 id="bike-details-title">Поломки велосипеда</h3>
        <button class="secondary outline" onclick="closeBikeDetails()">Закрыть</button>
    </header>

    <div id="breakdowns-loading">Загрузка...</div>
    <div id="breakdowns-error" style="color: red; display: none;"></div>

    <table id="breakdowns-table" style="display: none;">
        <thead>
        <tr>
            <th>Причина</th>
            <th>Стоимость</th>
            <th>Дата</th>
            <th>Статус</th>
        </tr>
        </thead>
        <tbody id="breakdowns-tbody"></tbody>
    </table>

    <div id="breakdowns-empty" style="display: none; text-align: center; color: var(--pico-muted-color);">
        У этого велосипеда нет поломок
    </div>
</article>
{{end}}
