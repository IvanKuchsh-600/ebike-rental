{{define "content"}}
<h2 style="margin-bottom: 2rem;">Выплаты</h2>

<!-- Preview -->
<article style="margin-bottom: 2rem;">
    <header>
        <h3>Расчёт за месяц</h3>
    </header>

    <div style="display: flex; gap: 1rem; align-items: end; flex-wrap: wrap;">
        <label style="flex: 1; min-width: 200px;">
            Месяц
            <input type="month" id="preview-month" value="">
        </label>
        <button onclick="loadPartnerPreview()" style="margin-bottom: 1rem;">Посчитать</button>
    </div>

    <div id="preview-loading" style="display: none;">Загрузка...</div>
    <div id="preview-error" style="color: red; display: none;"></div>

    <div id="preview-result" style="display: none; margin-top: 1rem;">
        <div class="grid">
            <div style="text-align: center; padding: 1rem;">
                <h4>Общая выручка</h4>
                <p style="font-size: 1.8rem; font-weight: bold;" id="preview-revenue">—</p>
            </div>
            <div style="text-align: center; padding: 1rem;">
                <h4>Ваша доля</h4>
                <p style="font-size: 1.8rem; font-weight: bold; color: green;" id="preview-share">—</p>
            </div>
        </div>
    </div>
</article>

<!-- История -->
<section>
    <h3>История</h3>

    <div id="payouts-loading">Загрузка...</div>
    <div id="payouts-error" style="color: red; display: none;"></div>

    <table id="payouts-table" style="display: none;">
        <thead>
        <tr>
            <th>Период</th>
            <th>Выручка</th>
            <th>Ваша доля</th>
            <th>Статус</th>
        </tr>
        </thead>
        <tbody id="payouts-tbody"></tbody>
    </table>

    <div id="payouts-empty" style="display: none; text-align: center; color: var(--pico-muted-color);">
        Пока нет выплат
    </div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', loadPartnerPayoutsPage);
</script>
{{end}}
