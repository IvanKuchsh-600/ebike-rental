name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Найдены неотформатированные файлы:"
            echo "$UNFORMATTED"
            echo ""
            echo "Запусти локально: gofmt -w ."
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -v ./...